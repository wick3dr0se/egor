[package]
name = "egor"
version = "0.11.0"
edition = "2024"
authors = ["wick3dr0se <wick3dr0se@protonmail.com>"]
description = "A dead simple 2D graphics engine"
license = "MIT"
repository = "https://github.com/wick3dr0se/egor"
keywords = ["2d", "graphics", "wgpu", "winit"]
categories = ["graphics", "game-development"]
exclude = ["media/"]

[workspace]
members = ["xtask", "crates/*", "demos/*"]
resolver = "2"

[features]
default = []
log = ["egor_app/log", "egor_render/log"]

webgl = ["egor_render/webgl"]
angle = ["egor_render/angle"]
gles = ["egor_render/gles"]
vulkan = ["egor_render/vulkan"]

hot_reload = ["dep:dioxus-devtools"]
ui = ["dep:egui", "dep:egui-wgpu", "dep:egui-winit"]

[dependencies]
egor_app = { version = "0.11.0", path = "crates/egor_app" }
egor_render = { version = "0.11.0", path = "crates/egor_render" }

color = "0.3.1"
glam = "0.30.4"
cosmic-text = "0.14.0"
lyon = { version = "1.0.16" }
egui = { version = "0.37.0", optional = true, features = ["default_fonts"] }
egui-wgpu = { version = "0.37.0", optional = true, default-features = false }
egui-winit = { version = "0.37.0", optional = true, default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus-devtools = { version = "0.7.0-alpha.1", optional = true }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
lto = false
strip = false
debug = true
codegen-units = 16
panic = "unwind"
